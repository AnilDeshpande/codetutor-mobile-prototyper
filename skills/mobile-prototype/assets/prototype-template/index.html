<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{APP_NAME}} — prototype</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <!-- Android shell. Screens render into <main id="screen">; see screens.js. -->
  <div class="app" id="app">
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <span class="status-icons">
        <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8 3 3 3-3a4.24 4.24 0 0 0-6 0zm-4-4 2 2a7.07 7.07 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M2 22h20V2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
      </span>
    </div>

    <nav class="nav" id="nav" aria-label="Main"></nav>

    <div class="pane">
      <header class="top-app-bar" id="top-app-bar">
        <button type="button" class="icon-button" id="up-button" aria-label="Navigate up" data-testid="up" hidden></button>
        <h1 id="screen-title"></h1>
        <div class="top-actions" id="top-actions"></div>
      </header>
      <div class="banner" id="banner" role="status" hidden></div>
      <main id="screen" tabindex="-1" data-screen="" data-state=""></main>
      <button type="button" class="fab" id="fab" hidden></button>
      <div class="snackbar" id="snackbar" role="status" aria-live="polite" data-testid="snackbar" hidden></div>
    </div>

    <div class="system-nav" role="toolbar" aria-label="System navigation">
      <button type="button" id="system-back" aria-label="System back" data-testid="system-back"><svg viewBox="0 0 24 24"><path d="M17 4v16L5 12z"/></svg></button>
      <button type="button" id="system-home" aria-label="System home" data-testid="system-home"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 14a6 6 0 1 1 0-12 6 6 0 0 1 0 12z"/></svg></button>
      <button type="button" aria-label="Recent apps" disabled><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/></svg></button>
    </div>

    <!-- Overlays live inside the app frame (not the browser's top layer) so the simulated
         system navigation bar stays usable while a dialog or sheet is open, as on Android. -->
    <div class="scrim" id="scrim" hidden></div>
    <dialog id="dialog" class="app-dialog"></dialog>
    <dialog id="sheet" class="bottom-sheet"></dialog>

    <div class="launcher" id="launcher" hidden>
      <button type="button" data-testid="launcher-open"><span class="app-icon" aria-hidden="true">◆</span><span>Open {{APP_NAME}}</span></button>
    </div>
  </div>

  <script src="mock-data.js"></script>
  <script src="app.js"></script>
  <script src="screens.js"></script>
</body>
</html>
